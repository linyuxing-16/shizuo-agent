<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shizuo Agent — AI 语音助手</title>
  <style>
    /* ── Reset & Variables ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --bg-alt: #1e293b;
      --surface: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --thinking: #7c3aed;
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.2s ease;
      --live2d-size: 430px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
      padding-top: max(12px, env(safe-area-inset-top));
    }

    .app {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 24px);
      min-height: calc(100dvh - 24px);
    }

    /* ── Header ────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    .brand-text .subtitle {
      font-size: 12px;
      color: var(--text-dim);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-dim);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
      text-decoration: none;
      touch-action: manipulation;
      user-select: none;
    }

    .icon-btn:hover {
      background: var(--bg-alt);
      border-color: var(--accent);
      color: var(--text);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* ── Status Bar ────────────────────────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex-shrink: 0;
      margin: 10px 0;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background var(--transition), box-shadow var(--transition);
    }

    .status-indicator.idle      { background: var(--text-muted); }
    .status-indicator.loading   { background: var(--warning); box-shadow: 0 0 6px var(--warning); animation: pulse 1s ease-in-out infinite; }
    .status-indicator.listening { background: var(--success); box-shadow: 0 0 8px rgba(34,197,94,0.5); animation: pulse 1.2s ease-in-out infinite; }
    .status-indicator.recording { background: var(--danger); box-shadow: 0 0 8px rgba(239,68,68,0.5); animation: pulse 0.6s ease-in-out infinite; }
    .status-indicator.processing{ background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); animation: pulse 0.8s ease-in-out infinite; }
    .status-indicator.thinking  { background: var(--thinking); box-shadow: 0 0 8px rgba(124,58,237,0.5); animation: pulse 0.9s ease-in-out infinite; }
    .status-indicator.speaking  { background: #06b6d4; box-shadow: 0 0 8px rgba(6,182,212,0.5); animation: pulse 0.7s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.5; }
    }

    .status-text {
      font-size: 13px;
      color: var(--text-dim);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mic-level-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .mic-level-label {
      font-size: 12px;
    }

    .mic-level {
      width: 90px;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .mic-level-fill {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 120ms linear;
    }

    .status-wave {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 20px;
    }

    .status-wave span {
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      animation: wave 0.5s ease-in-out infinite alternate;
    }

    .status-wave span:nth-child(1) { height: 6px;  animation-delay: 0s; }
    .status-wave span:nth-child(2) { height: 12px; animation-delay: 0.1s; }
    .status-wave span:nth-child(3) { height: 18px; animation-delay: 0.2s; }
    .status-wave span:nth-child(4) { height: 14px; animation-delay: 0.15s; }
    .status-wave span:nth-child(5) { height: 8px;  animation-delay: 0.05s; }

    @keyframes wave {
      from { transform: scaleY(0.5); }
      to   { transform: scaleY(1); }
    }

    /* ── Model Loading Progress ────────────────────────────────────────── */
    .model-progress {
      display: none;
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      margin: -10px 0 10px;
      flex-shrink: 0;
    }
    .model-progress.visible { display: block; }

    .model-progress .progress-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
      padding: 2px 0;
    }
    .model-progress .progress-item .check {
      width: 16px;
      text-align: center;
      flex-shrink: 0;
    }
    .model-progress .progress-item.done  { color: var(--success); }
    .model-progress .progress-item.active{ color: var(--warning); }
    .model-progress .progress-item.pending{ color: var(--text-muted); }

    /* ── Conversation Area ─────────────────────────────────────────────── */
    .conversation {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 16px;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Live2D Panel (desktop) ────────────────────────────────────────── */
    .live2d-panel {
      width: var(--live2d-size);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      position: sticky;
      top: 0;
      align-self: flex-start;
      min-height: 470px;
      /* 裁剪溢出元素，阻止点击穿透到下方控件 */
      overflow: hidden;
      contain: paint;
    }

    #live2d-canvas {
      width: 100%;
      height: 220px;
      position: relative;
    }

    #live2d-canvas canvas {
      width: 100% !important;
      height: 100% !important;
    }

    #live2d-canvas #oml2d-stage {
      width: 100%;
      height: 100%;
    }

    #live2d-canvas #oml2d-statusBar {
      display: none !important;
    }

    .live2d-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-top: 8px;
    }

    .live2d-status-tip {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── Messages Panel ────────────────────────────────────────────────── */
    .messages-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding-right: 4px;
      min-height: 0;
      position: relative;
      z-index: 1;
      scroll-behavior: smooth;
    }

    .messages-panel:empty {
      justify-content: center;
      align-items: center;
      display: flex;
    }

    .messages-panel:empty::after {
      content: '唤醒词激活后开始对话…';
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      max-width: 280px;
      line-height: 1.6;
    }

    /* ── Message Bubbles ──────────────────────────────────────────────── */
    .msg {
      display: flex;
      gap: 10px;
      animation: msgIn 0.3s ease;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .msg.user .msg-avatar        { background: var(--accent); }
    .msg.assistant .msg-avatar   { background: var(--thinking); }
    .msg.error .msg-avatar       { background: var(--danger); }

    .msg-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.error .msg-bubble {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }

    .msg-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 2px;
      display: block;
    }
    .msg.user .msg-label { text-align: right; }

    /* ── Thinking Indicator ────────────────────────────────────────────── */
    .thinking {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .thinking-dots {
      display: flex;
      gap: 4px;
    }
    .thinking-dots span {
      width: 6px;
      height: 6px;
      background: var(--text-dim);
      border-radius: 50%;
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1); }
    }

    /* ── Controls ──────────────────────────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex-shrink: 0;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .controls select,
    .controls input[type="number"],
    .controls input[type="text"] {
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition);
      touch-action: manipulation;
    }
    .controls select:focus,
    .controls input[type="number"]:focus,
    .controls input[type="text"]:focus {
      border-color: var(--accent);
    }
    .controls select {
      min-width: 130px;
      cursor: pointer;
    }
    .controls input[type="text"] {
      min-width: 150px;
    }
    .controls select option {
      background: var(--bg);
      color: var(--text);
    }

    .controls label {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .controls input[type="number"] { width: 56px; }

    .btn {
      padding: 10px 20px;
      min-height: 44px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), transform 0.1s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
      user-select: none;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }

    .controls .spacer { flex: 1; }

    /* ── Scrollbar ─────────────────────────────────────────────────────── */
    .messages-panel::-webkit-scrollbar { width: 4px; }
    .messages-panel::-webkit-scrollbar-track { background: transparent; }
    .messages-panel::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }
    .messages-panel::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ── Mobile (≤ 768px) ──────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .live2d-panel {
        width: 170px;
        min-height: 220px;
      }
      #live2d-canvas { height: 170px; }
      .msg-bubble { max-width: 90%; }
    }

    /* ── Mobile (≤ 600px) ──────────────────────────────────────────────── */
    @media (max-width: 600px) {
      body {
        padding: 8px;
        padding-top: max(8px, env(safe-area-inset-top));
      }
      .app { min-height: calc(100dvh - 16px); }

      .brand-text .subtitle { display: none; }
      .brand-text h1 { font-size: 16px; }

      .conversation {
        flex-direction: column;
        gap: 10px;
      }

      /* Live2D 全屏角色背景：面板铺满视口，角色放大居中，UI 浮在其上 */
      .live2d-panel {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        margin: 0;
        padding: 0;
        background: transparent;
        border: none;
        border-radius: 0;
        opacity: 1;
        pointer-events: none;
        z-index: 0;
        align-items: center;
        justify-content: center;
      }

      .live2d-name,
      .live2d-status-tip {
        display: none;
      }

      #live2d-canvas {
        height: 100vh;
        height: 100dvh;
        width: 100%;
        contain: layout style;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 状态栏与控件区半透明毛玻璃，让角色在全屏透出 */
      .status-bar,
      .controls {
        background: rgba(30, 41, 59, 0.55);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      #live2d-canvas canvas {
        pointer-events: none !important;
      }

      .messages-panel {
        padding: 2px 4px 2px 0;
      }

      .controls { flex-wrap: wrap; }
      .controls > label { width: 100%; flex: 1 1 100%; }
      .controls select,
      .controls input[type="text"] { width: 100%; }
      .controls .spacer { display: none; }
      .btn { flex: 1 1 0; justify-content: center; }

      .status-wave { display: none; }
      .status-text { font-size: 12px; }
      .mic-level-wrap { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo">🤖</div>
        <div class="brand-text">
          <h1>Shizuo Agent</h1>
          <div class="subtitle">AI 语音助手</div>
        </div>
      </div>
      <div class="header-actions">
        <a href="config.html" class="icon-btn" title="配置" target="_blank">⚙</a>
        <button class="icon-btn" id="clearChatBtn" title="清空对话">🗑</button>
      </div>
    </header>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-indicator idle" id="statusIndicator"></div>
      <span class="status-text" id="statusText">就绪 — 点击「开始监听」或按 Ctrl+Enter 启动</span>
      <div class="mic-level-wrap" id="micLevelWrap" title="麦克风能量">
        <span class="mic-level-label">🎤</span>
        <div class="mic-level"><span class="mic-level-fill" id="micLevelFill"></span></div>
      </div>
      <div class="status-wave" id="statusWave" style="display:none">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <!-- Model Loading Progress -->
    <div class="model-progress" id="modelProgress">
      <div class="progress-item pending" id="mpLive2D">
        <span class="check">○</span> 加载 Live2D 角色…
      </div>
    </div>

    <!-- Conversation Area -->
    <div class="conversation">
      <div class="live2d-panel">
        <div id="live2d-canvas"></div>
        <div class="live2d-name" id="live2dName">Shizuo</div>
        <div class="live2d-status-tip" id="live2dStatusTip">● 就绪</div>
      </div>
      <div class="messages-panel" id="messagesPanel"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <label>
        唤醒词
        <input id="wakeWordInput" list="wakeWordList" placeholder="输入唤醒词" autocomplete="off" />
        <datalist id="wakeWordList">
          <option value="hey jarvis"></option>
          <option value="alexa"></option>
          <option value="hey mycroft"></option>
          <option value="hey rhasspy"></option>
          <option value="weather"></option>
          <option value="timer"></option>
          <option value="小助手"></option>
          <option value="嘿 时作"></option>
          <option value="你好 助手"></option>
        </datalist>
      </label>
      <label>
        超时
        <input type="number" id="silenceTimeout" value="2000" min="500" max="10000" step="100" />
        <span style="font-size:11px;color:var(--text-muted)">ms</span>
      </label>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="startBtn">🎤 开始监听</button>
      <button class="btn btn-danger"  id="stopBtn"  disabled>⏹ 停止</button>
    </div>
  </div>

  <script type="module">
    // ── Imports ──────────────────────────────────────────────────────────
    import { loadOml2d } from 'oh-my-live2d';
    import { voiceActivate, VAD_THRESHOLD } from './src/wakeword.js';
    import agent, { streamAgent } from './src/agent.js';
    import { streamTts } from './src/tts.js';
    import { initAudioContext, playPcm16, stopPlayback } from './src/audioPlayer.js';

    // ── DOM refs ─────────────────────────────────────────────────────────
    const $ = (id) => document.getElementById(id);

    const messagesPanel    = $('messagesPanel');
    const startBtn         = $('startBtn');
    const stopBtn          = $('stopBtn');
    const clearChatBtn     = $('clearChatBtn');
    const wakeWordInput    = $('wakeWordInput');
    const silenceTimeout   = $('silenceTimeout');
    const statusIndicator  = $('statusIndicator');
    const statusText       = $('statusText');
    const statusWave       = $('statusWave');
    const micLevelFill     = $('micLevelFill');
    const modelProgress    = $('modelProgress');
    const mpLive2D         = $('mpLive2D');
    const live2dCanvas     = $('live2d-canvas');
    const live2dNameEl     = $('live2dName');
    const live2dStatusTip  = $('live2dStatusTip');

    // ── 唤醒词初始值（localStorage 持久化，默认中文） ─────────────────────
    wakeWordInput.value = localStorage.getItem('WAKE_WORD') || '你好 助手';

    // ── Live2D Model Sources ─────────────────────────────────────────────
    // 模型文件来自 Live2D 官方 CubismWebSamples 仓库
    const CDN_BASE = 'https://cdn.jsdelivr.net/gh/Live2D/CubismWebSamples@develop/Samples/Resources';

    const MODEL_SOURCES = {
      hiyori: {
        name: '日依 (Hiyori)',
        path: `${CDN_BASE}/Hiyori/Hiyori.model3.json`,
      },
      haru: {
        name: '春 (Haru)',
        path: `${CDN_BASE}/Haru/Haru.model3.json`,
      },
      mao: {
        name: '小萌 (Mao)',
        path: `${CDN_BASE}/Mao/Mao.model3.json`,
      },
      mark: {
        name: '马克 (Mark)',
        path: `${CDN_BASE}/Mark/Mark.model3.json`,
      },
      natori: {
        name: '名取 (Natori)',
        path: `${CDN_BASE}/Natori/Natori.model3.json`,
      },
      wanko: {
        name: '汪口 (Wanko)',
        path: `${CDN_BASE}/Wanko/Wanko.model3.json`,
      },
      rice: {
        name: '小饭 (Rice)',
        path: `${CDN_BASE}/Rice/Rice.model3.json`,
      },
    };

    // ── State ────────────────────────────────────────────────────────────
    const THREAD_ID = 'shizuo-thread-main';
    let currentStatus = 'idle';
    let isRunning = false;
    let abortController = null;
    let oml2dInstance = null;
    let live2dReady = false;

    // ── 麦克风能量诊断状态 ────────────────────────────────────────────────
    const SILENT_HINT_MS = 10000; // 连续无声超过此时长后提示
    const ROUND_COOLDOWN_MS = 400; // TTS 播放结束到重新监听前的冷却，避免扬声器余音触发 ASR
    let lastVoiceAt = 0;
    let silenceHintShown = false;

    // ── Status Helpers ───────────────────────────────────────────────────
    function setStatus(status, text) {
      currentStatus = status;
      statusIndicator.className = `status-indicator ${status}`;
      statusText.textContent = text;
      statusWave.style.display = (status === 'recording' || status === 'listening') ? '' : 'none';

      if (status === 'loading') {
        modelProgress.classList.add('visible');
      } else {
        modelProgress.classList.remove('visible');
      }

      // Sync Live2D status tip
      if (live2dReady) {
        const tipMap = {
          idle: '● 就绪',
          loading: '◌ 加载中…',
          listening: '● 聆听中…',
          recording: '● 录音中…',
          processing: '◌ 处理中…',
          thinking: '◌ 思考中…',
          speaking: '● 发音中…',
        };
        live2dStatusTip.textContent = tipMap[status] || '● 就绪';
      }
    }

    function markProgress(id, state) {
      const el = $('mp' + id);
      if (!el) return;
      const icons = { pending: '○', active: '◌', done: '✓' };
      el.className = `progress-item ${state}`;
      el.querySelector('.check').textContent = icons[state] || '○';
    }

    // ── Message Helpers ──────────────────────────────────────────────────
    function scrollToBottom() {
      messagesPanel.scrollTop = messagesPanel.scrollHeight;
    }

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      const avatarMap = { user: '👤', assistant: '🤖', error: '⚠️' };

      div.innerHTML = `
        <div class="msg-avatar">${avatarMap[role] || '?'}</div>
        <div>
          <span class="msg-label">${role === 'user' ? '你' : role === 'assistant' ? live2dNameEl.textContent : '错误'}</span>
          <div class="msg-bubble">${escapeHtml(content)}</div>
        </div>
      `;
      messagesPanel.appendChild(div);
      scrollToBottom();
      return div;
    }

    function addThinking() {
      const div = document.createElement('div');
      div.className = 'msg assistant';
      div.id = 'thinkingIndicator';
      div.innerHTML = `
        <div class="msg-avatar">🤖</div>
        <div>
          <span class="msg-label">${live2dNameEl.textContent}</span>
          <div class="thinking">
            <span class="thinking-dots">
              <span></span><span></span><span></span>
            </span>
            <span style="font-size:12px;color:var(--text-dim)">思考中…</span>
          </div>
        </div>
      `;
      messagesPanel.appendChild(div);
      scrollToBottom();
    }

    function removeThinking() {
      const el = document.getElementById('thinkingIndicator');
      if (el) el.remove();
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    // ── Check Config ─────────────────────────────────────────────────────
    function checkConfig() {
      const missing = [];
      if (!localStorage.getItem('DEEPSEEK_API_KEY')) missing.push('DEEPSEEK_API_KEY');
      if (!localStorage.getItem('MEM0_API_KEY'))  missing.push('MEM0_API_KEY');
      if (!localStorage.getItem('MIMO_API_KEY'))  missing.push('MIMO_API_KEY');
      if (missing.length > 0) {
        addMessage('error', `缺少 API Key 配置：${missing.join('、')}。请先前往 配置页面 设置。`);
        setStatus('idle', '配置不完整 — 请先设置 API Key');
        return false;
      }
      return true;
    }

    // ── Live2D 移动端居中 ────────────────────────────────────────────────
    // oh-my-live2d 在移动端默认把模型放在舞台左上角（position (0,0) + anchor 接近 (0,0)），
    // 这里读取模型实际包围盒，将模型中心对齐到 #live2d-canvas 的中心。
    let centerResizeTimer = null;

    /**
     * 将 Live2D 角色在画布内居中显示（仅移动视口生效）。
     */
    function centerLive2DModel() {
      if (!oml2dInstance?.models?.model || !live2dReady) return;
      // 与 oh-my-live2d 的移动端判定保持一致（≤768px 使用 mobileScale/mobilePosition）
      if (!window.matchMedia('(max-width: 768px)').matches) return;

      const model = oml2dInstance.models.model;

      // 以 PIXI 舞台元素的实际尺寸为坐标系（模型绘制与 getBounds 都基于它），
      // 不依赖 #live2d-canvas 的布局尺寸
      const stageEl = oml2dInstance.stage?.element;
      if (!stageEl) return;
      const stageW = stageEl.clientWidth;
      const stageH = stageEl.clientHeight;
      if (stageW <= 0 || stageH <= 0) return;

      let bounds;
      try {
        bounds = model.getBounds();
      } catch { /* 忽略：模型尚未就绪 */ return; }
      if (!bounds || bounds.width <= 0 || bounds.height <= 0) return;

      // 移动端把角色放大到铺满屏幕高度：按当前包围盒高度等比放大到舞台高度
      const baseScale = model.scale?.x || 0.04;
      oml2dInstance.setModelScale((baseScale * stageH) / bounds.height);

      // 放大后重新测量包围盒，将模型中心对齐到舞台中心（幂等，可反复调用）
      const scaled = model.getBounds();
      const dx = stageW / 2 - (scaled.x + scaled.width / 2);
      const dy = stageH / 2 - (scaled.y + scaled.height / 2);
      oml2dInstance.setModelPosition({ x: model.x + dx, y: model.y + dy });
    }

    /**
     * 视口尺寸变化后延迟重新居中（防抖，避免横竖屏切换/滚动时频繁计算）。
     */
    function scheduleCenterLive2D() {
      clearTimeout(centerResizeTimer);
      centerResizeTimer = setTimeout(centerLive2DModel, 150);
    }

    // ── Initialize Live2D ────────────────────────────────────────────────
    async function initLive2D() {
      const modelKey = localStorage.getItem('LIVE2D_MODEL') || 'hiyori';
      const charName = localStorage.getItem('LIVE2D_NAME') || 'Shizuo';
      const source = MODEL_SOURCES[modelKey] || MODEL_SOURCES.hiyori;

      live2dNameEl.textContent = charName;

      markProgress('Live2D', 'active');

      try {
        oml2dInstance = await loadOml2d({
          parentElement: live2dCanvas,
          mobileDisplay: true,
          models: [{
            name: modelKey,
            path: source.path,
            anchor: [0.01, 0.079],
            scale: 0.14,
            mobileScale: 0.04,
            stageStyle: {
              width: '100%',
              height: '100%',
              background: 'transparent',
              overflow: 'hidden',
            },
            // oh-my-live2d 移动端分支只合并 mobileStageStyle（stageStyle 仅桌面生效），
            // 不设置的话舞台会退回默认的 fixed 定位小窗，角色无法在面板内显示
            mobileStageStyle: {
              position: 'relative',
              left: 'auto',
              right: 'auto',
              bottom: 'auto',
              transform: 'none',
              width: '100%',
              height: '100%',
              background: 'transparent',
              overflow: 'hidden',
            },
            motionPreloadStrategy: 'IDLE',
          }],
          tips: {
            idleTips: [],
            messageDuration: 0,
          },
          statusBar: false,
          menus: false,
          sayHello: false,
          transitionTime: 0,
        });

        live2dReady = true;
        markProgress('Live2D', 'done');

        // 库的 load 事件先于内部 settingModel（重置位置）触发，
        // 因此延后到当前任务链结束后再居中，避免被覆盖
        oml2dInstance.events.add('load', (status) => {
          if (status === 'success') setTimeout(centerLive2DModel, 0);
        });
        centerLive2DModel();
        window.addEventListener('resize', scheduleCenterLive2D);
      } catch (err) {
        console.warn('Live2D 加载失败:', err);
        markProgress('Live2D', 'pending');
        live2dReady = false;

        // Show fallback avatar in Live2D panel
        live2dCanvas.innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:13px;gap:4px;">
            <span style="font-size:40px">🤖</span>
            <span>角色加载失败</span>
          </div>
        `;
      }
    }

    // ── 麦克风能量诊断 ──────────────────────────────────────────────────
    function handleAudioLevel(rms) {
      // RMS 0~1 → 百分比条（语音约 0.02~0.2，放大 400 倍便于观察）
      const levelPct = Math.max(0, Math.min(100, Math.round(rms * 400)));
      micLevelFill.style.width = `${levelPct}%`;

      if (rms >= VAD_THRESHOLD) {
        lastVoiceAt = Date.now();
        if (silenceHintShown) {
          silenceHintShown = false;
          if (currentStatus === 'listening') {
            setStatus('listening', '正在监听唤醒词…');
          }
        }
      } else if (
        currentStatus === 'listening' &&
        !silenceHintShown &&
        Date.now() - lastVoiceAt >= SILENT_HINT_MS
      ) {
        silenceHintShown = true;
        setStatus('listening', '🔇 未检测到语音输入 — 请检查麦克风或系统音量');
      }
    }

    // ── Main Voice Loop ──────────────────────────────────────────────────
    async function startVoiceLoop() {
      if (isRunning) return;
      if (!checkConfig()) return;

      isRunning = true;
      abortController = new AbortController();
      const signal = abortController.signal;

      const wakeWord = wakeWordInput.value.trim() || '你好 助手';
      localStorage.setItem('WAKE_WORD', wakeWord);
      const timeout  = parseInt(silenceTimeout.value, 10) || 2000;

      startBtn.disabled = true;
      stopBtn.disabled = false;
      wakeWordInput.disabled = true;
      silenceTimeout.disabled = true;

      setStatus('listening', '正在监听唤醒词…');
      lastVoiceAt = Date.now();
      silenceHintShown = false;
      micLevelFill.style.width = '0%';

      try {
        // 本轮结束，准备下一轮监听（空识别与正常完成共用）
        function resetForNextRound() {
          lastVoiceAt = Date.now();
          silenceHintShown = false;
          micLevelFill.style.width = '0%';
          setStatus('listening', '持续监听中，说出唤醒词开始下一轮');
        }

        // ── 多轮免点击循环：每轮走完识别→AI→TTS 后回到唤醒监听 ──
        while (!signal.aborted) {
          const asrResult = await Promise.race([
            voiceActivate(wakeWord, timeout, { onAudioLevel: handleAudioLevel }),
            new Promise((_, reject) => {
              signal.addEventListener('abort', () => {
                reject(new DOMException('用户停止', 'AbortError'));
              });
            }),
          ]);

          if (signal.aborted) return;

          setStatus('processing', '语音识别完成，正在解析…');

          let transcript = '';
          try {
            const parsed = typeof asrResult === 'string' ? JSON.parse(asrResult) : asrResult;
            transcript = parsed.choices?.[0]?.message?.content || '';
          } catch {
            transcript = typeof asrResult === 'string' ? asrResult : '';
          }

          if (!transcript.trim()) {
            addMessage('error', '未检测到语音内容，请重试。');
            resetForNextRound();
            continue;
          }

          addMessage('user', transcript);
          setStatus('thinking', 'AI 正在思考…');

          // 创建空的消息气泡，后续流式填充
          const msgDiv = document.createElement('div');
          msgDiv.className = 'msg assistant';
          msgDiv.innerHTML = `
            <div class="msg-avatar">🤖</div>
            <div>
              <span class="msg-label">${live2dNameEl.textContent}</span>
              <div class="msg-bubble"></div>
            </div>
          `;
          messagesPanel.appendChild(msgDiv);
          scrollToBottom();
          const bubbleEl = msgDiv.querySelector('.msg-bubble');

          let aiContent = '';
          try {
            for await (const chunk of streamAgent(
              [{ role: 'user', content: transcript }],
              { configurable: { thread_id: THREAD_ID } },
            )) {
              aiContent += chunk;
              bubbleEl.textContent = aiContent;
              scrollToBottom();
            }

            if (!aiContent.trim()) {
              bubbleEl.textContent = '抱歉，我没有理解您的意思。';
            }
          } catch (err) {
            bubbleEl.textContent = `请求失败：${err.message}`;
          }

          removeThinking();

          // ── TTS 语音合成 ──────────────────────────────────────────────
          if (aiContent.trim() && !signal.aborted) {
            setStatus('speaking', '正在合成闽南语语音…');
            try {
              initAudioContext();
              for await (const audioChunk of streamTts(aiContent)) {
                if (signal.aborted) break;
                playPcm16(new Int16Array(audioChunk));
              }
            } catch (err) {
              console.error('TTS 播放失败:', err);
            }
          }

          // ── 本轮结束：等待扬声器余音消散后回到唤醒监听 ──
          if (signal.aborted) return;
          await new Promise((resolve) => setTimeout(resolve, ROUND_COOLDOWN_MS));
          if (signal.aborted) return;

          resetForNextRound();
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          addMessage('assistant', '⏸ 已停止监听。');
          setStatus('idle', '已停止');
        } else {
          addMessage('error', `❌ ${err.message}`);
          setStatus('idle', '发生错误');
        }
      } finally {
        if (!signal.aborted) {
          finishLoop();
        }
      }
    }

    function finishLoop() {
      isRunning = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      wakeWordInput.disabled = false;
      silenceTimeout.disabled = false;
      micLevelFill.style.width = '0%';
      silenceHintShown = false;
    }

    function stopVoiceLoop() {
      stopPlayback();
      if (abortController) {
        abortController.abort();
        abortController = null;
      }
      finishLoop();
      setStatus('idle', '已停止');
    }

    // ── Clear Chat ───────────────────────────────────────────────────────
    function clearChat() {
      messagesPanel.innerHTML = '';
      // 同步清除 IndexedDB 中该线程的持久化对话上下文
      agent.clearThread(THREAD_ID).catch((err) => {
        console.warn('清除持久化对话上下文失败:', err);
      });
    }

    // ── Keyboard Shortcut ────────────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        if (isRunning) {
          stopVoiceLoop();
        } else {
          startVoiceLoop();
        }
      }
    });

    // ── Event Binding ────────────────────────────────────────────────────
    startBtn.addEventListener('click', startVoiceLoop);
    stopBtn.addEventListener('click', stopVoiceLoop);
    clearChatBtn.addEventListener('click', clearChat);

    // ── Init ─────────────────────────────────────────────────────────────
    // Load character name
    const savedName = localStorage.getItem('LIVE2D_NAME') || 'Shizuo';
    live2dNameEl.textContent = savedName;

    // Initialize Live2D (fire-and-forget, don't block UI)
    initLive2D();

    setStatus('idle', '就绪 — 点击「开始监听」或按 Ctrl+Enter 启动');
  </script>
</body>
</html>
